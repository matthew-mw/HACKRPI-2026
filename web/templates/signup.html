<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create your account · Volunteer Together</title><link rel="stylesheet" href="/static/css/site.css"><script src="/static/js/auth.js" defer></script></head>
<body class="auth-page"><header><a class="brand" href="/">Volunteer Together<span>Small acts. Real impact.</span></a></header><main class="auth-card"><p class="eyebrow">YOUR COMMUNITY STARTS HERE</p><h1>Create your account</h1><p class="intro">Find your people. Make a difference together.</p><form action="/signup" method="post" data-auth="signup"><div class="name-fields"><label>First name<input name="first_name" autocomplete="given-name" maxlength="100" required></label><label>Last name<input name="last_name" autocomplete="family-name" maxlength="100" required></label></div><label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><p class="hint">Use at least 12 characters. A phrase with several words works well.</p><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" required></label><p role="alert" aria-live="polite"></p><button type="submit">Create account <span aria-hidden="true">→</span></button></form><p>Already have an account? <a href="/login">Sign in</a></p><noscript>Please enable JavaScript to sign in or create an account.</noscript></main><footer>A little of your time can mean a lot.</footer></body></html>
